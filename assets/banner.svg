<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#090d18" />
    </linearGradient>

    <!-- Border Gradient with dynamic color shifting -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Stream Line Gradients -->
    <linearGradient id="stream-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="stream-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-grid {
        stroke: #1e293b;
        stroke-width: 0.7;
        opacity: 0.35;
      }
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scale(0.9); opacity: 0.2; }
        100% { transform: scale(1.15); opacity: 0.45; }
      }
      .flowing-line-1 {
        stroke-dasharray: 80 180;
        animation: flow1 7s linear infinite;
      }
      .flowing-line-2 {
        stroke-dasharray: 60 140;
        animation: flow2 9s linear infinite;
      }
      .flowing-line-3 {
        stroke-dasharray: 100 200;
        animation: flow1 11s linear infinite reverse;
      }
      @keyframes flow1 {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -520; }
      }
      @keyframes flow2 {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 400; }
      }
      .badge-glow {
        animation: badgePulse 3s ease-in-out infinite alternate;
      }
      @keyframes badgePulse {
        0% { filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.4)); }
        100% { filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.7)); }
      }
      .node-pulse {
        animation: nodeGlow 2.5s ease-in-out infinite alternate;
      }
      @keyframes nodeGlow {
        0% { r: 3.5; opacity: 0.6; }
        100% { r: 5.5; opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background Base Container -->
  <rect x="2" y="2" width="996" height="316" rx="16" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2" />

  <!-- Ambient Light Orbs (Background depth) -->
  <g opacity="0.35">
    <circle cx="150" cy="80" r="130" fill="#38bdf8" filter="url(#glow)" class="pulse-circle" style="transform-origin: 150px 80px;" />
    <circle cx="850" cy="240" r="140" fill="#a855f7" filter="url(#glow)" class="pulse-circle" style="transform-origin: 850px 240px;" />
    <circle cx="500" cy="160" r="90" fill="#6366f1" filter="url(#glow)" class="pulse-circle" style="transform-origin: 500px 160px;" />
  </g>

  <!-- Cybernetic Grid Pattern -->
  <g class="bg-grid">
    <line x1="50" y1="0" x2="50" y2="320" />
    <line x1="125" y1="0" x2="125" y2="320" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="275" y1="0" x2="275" y2="320" />
    <line x1="350" y1="0" x2="350" y2="320" />
    <line x1="425" y1="0" x2="425" y2="320" />
    <line x1="500" y1="0" x2="500" y2="320" />
    <line x1="575" y1="0" x2="575" y2="320" />
    <line x1="650" y1="0" x2="650" y2="320" />
    <line x1="725" y1="0" x2="725" y2="320" />
    <line x1="800" y1="0" x2="800" y2="320" />
    <line x1="875" y1="0" x2="875" y2="320" />
    <line x1="950" y1="0" x2="950" y2="320" />

    <line x1="0" y1="40" x2="1000" y2="40" />
    <line x1="0" y1="90" x2="1000" y2="90" />
    <line x1="0" y1="140" x2="1000" y2="140" />
    <line x1="0" y1="190" x2="1000" y2="190" />
    <line x1="0" y1="240" x2="1000" y2="240" />
    <line x1="0" y1="290" x2="1000" y2="290" />
  </g>

  <!-- Dynamic Gateway Flow Lines (Representing Server <-> WSGI/ASGI <-> App Pipeline) -->
  <g opacity="0.6">
    <!-- Top data circuit -->
    <path d="M 40 45 L 260 45 L 310 85 L 680 85 L 730 45 L 960 45" fill="none" stroke="url(#stream-blue)" stroke-width="2.5" class="flowing-line-1" />
    <!-- Middle connection circuit -->
    <path d="M 50 275 L 340 275 L 390 235 L 620 235 L 670 275 L 950 275" fill="none" stroke="url(#stream-purple)" stroke-width="2.5" class="flowing-line-2" />
    <!-- Lower subtle circuit -->
    <path d="M 100 160 L 280 160 L 320 190 L 700 190 L 740 160 L 900 160" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.25" class="flowing-line-3" />
  </g>

  <!-- Dynamic Circuit Junction Nodes -->
  <g fill="#38bdf8" filter="url(#subtle-glow)">
    <circle cx="310" cy="85" r="4" class="node-pulse" />
    <circle cx="680" cy="85" r="4" class="node-pulse" />
    <circle cx="390" cy="235" r="4" class="node-pulse" style="animation-delay: 1s;" />
    <circle cx="620" cy="235" r="4" class="node-pulse" style="animation-delay: 1s;" />
    <circle cx="260" cy="45" r="3.5" />
    <circle cx="730" cy="45" r="3.5" />
    <circle cx="340" cy="275" r="3.5" />
    <circle cx="670" cy="275" r="3.5" />
  </g>

  <!-- ==================== FOREGROUND CONTENT (ALWAYS CRISP & ONSCREEN) ==================== -->
  
  <!-- Top Category Chip -->
  <g transform="translate(500, 52)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" class="badge-glow" />
    <circle cx="-118" cy="0" r="5" fill="#10b981" />
    <text x="-105" y="4.5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">PYTHON WSGI &amp; ASGI STACK</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(500, 126)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="900" letter-spacing="-0.5" fill="url(#text-grad)" filter="drop-shadow(0 3px 12px rgba(0,0,0,0.8))">
      Awesome WSGI Web Utilities
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(500, 168)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated directory of HTTP servers, gateway interfaces, web frameworks, async runtimes &amp; middleware
    </text>
  </g>

  <!-- Feature Badge Pills in Foreground -->
  <g transform="translate(500, 225)">
    <!-- Pill 1: PEP 3333 WSGI -->
    <g transform="translate(-315, 0)">
      <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#38bdf8">⚡ PEP 3333 WSGI</text>
    </g>

    <!-- Pill 2: ASGI Specification -->
    <g transform="translate(-105, 0)">
      <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#818cf8">🚀 Async ASGI</text>
    </g>

    <!-- Pill 3: Production Servers -->
    <g transform="translate(105, 0)">
      <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#c084fc">🛡️ Robust Servers</text>
    </g>

    <!-- Pill 4: Middleware & Tooling -->
    <g transform="translate(315, 0)">
      <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#34d399">📦 Rich Middleware</text>
    </g>
  </g>

  <!-- Bottom Spec Indicator -->
  <g transform="translate(500, 280)">
    <text x="0" y="0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#64748b" letter-spacing="1">
      SERVER ⇄ GATEWAY INTERFACE (PEP 3333 / ASGI 3.0) ⇄ APPLICATION
    </text>
  </g>
</svg>
